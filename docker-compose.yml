services:
  gazebo:
    build: .
    image: nidar-latest
    container_name: nidar-container
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-gzuser
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./worlds:/home/gzuser/gazebo_ws/worlds:rw
      - ./models:/home/gzuser/gazebo_ws/models:rw
    devices:
      - /dev/dri:/dev/dri
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    network_mode: host
    command: ["gz", "sim", "-v", "4", "worlds/world_standard_lidar.sdf"]
