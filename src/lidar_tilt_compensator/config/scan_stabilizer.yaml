/pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: true
    target_frame: "base_footprint"
    transform_tolerance: 0.1
    min_height: -0.20
    max_height: 0.50
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0047
    scan_time: 0.1
    range_min: 0.15
    range_max: 11.0
    use_inf: true
    concurrency_level: 1
