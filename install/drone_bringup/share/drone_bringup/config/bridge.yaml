# ros_gz_bridge config

# Clock
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# 2D Lidar Scan
- ros_topic_name: "/scan"
  gz_topic_name: "/model/iris/lidar/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Downward Rangefinder
- ros_topic_name: "/rangefinder"
  gz_topic_name: "/world/arena_world/model/iris_with_ardupilot/link/rangefinder_link/sensor/rangefinder/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Camera Image
- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/world/arena_world/model/iris_with_ardupilot/link/front_camera_link/sensor/front_down_camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Camera Info
- ros_topic_name: "/camera/camera_info"
  gz_topic_name: "/world/arena_world/model/iris_with_ardupilot/link/front_camera_link/sensor/front_down_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# IMU
- ros_topic_name: "/imu"
  gz_topic_name: "/world/arena_world/model/iris_with_ardupilot/model/iris_with_standoffs/link/imu_link/sensor/imu_sensor/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
